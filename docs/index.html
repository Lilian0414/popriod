<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fde6fa">
    <title>popriod</title>
    <link rel="preload" href="1.png" as="image" fetchpriority="high">
    <link rel="preload" href="2.png" as="image">
    <link rel="preload" href="background.webp" as="image" type="image/webp">
    <link rel="stylesheet" href="style.css?v=20260811-5">
</head>
<body>
    <main class="container">
        <div class="score" aria-label="個人點擊數">
            <span id="clickCount">0</span>
        </div>

        <button
            class="cat-button"
            id="popButton"
            type="button"
            aria-label="點擊貓咪"
        >
            <img src="1.png" alt="" id="cat" draggable="false" decoding="async" fetchpriority="high">
            <img src="2.png" alt="" id="cat2" draggable="false" decoding="async" hidden>
        </button>
    </main>

    <div class="global-fixed" aria-label="全世界累積點擊數">
        <span id="globalClickCount" aria-live="polite">0</span>
    </div>

    <script src="vendor/howler.core.min.js?v=2.2.4"></script>
    <script type="module" src="script.js?v=20260811-5"></script>

</html>
